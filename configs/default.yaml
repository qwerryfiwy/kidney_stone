# Default configuration for ENFM training / evaluation.
# Values match the paper's experimental setup (Section 3.5).

data:
  root: "./data_root"          # ImageFolder-style dir: stone/ , non_stone/
  image_size: 224
  batch_size: 64
  num_workers: 4
  val_split: 0.10
  test_split: 0.10             # only used by the single stratified-split protocol

model:
  name: "enfm"                 # enfm | fpn_avg | fpn_gmp | fpn_dual |
                                # resnet50 | mobilenetv3 | efficientnet_v2s | efficientnet_b0
  pyramid_channels: 256        # D in the paper
  pretrained: true
  num_classes: 2
  dropout_fc1: 0.3
  dropout_fc2: 0.2

optim:
  name: "adamw"
  lr: 5.0e-5
  weight_decay: 1.0e-4
  scheduler: "reduce_on_plateau"
  scheduler_factor: 0.5
  scheduler_patience: 2

train:
  epochs: 20
  early_stopping_patience: 5
  amp: true                    # automatic mixed precision
  grad_clip_norm: null
  seed: 42

logging:
  out_dir: "./runs"
  log_every_n_steps: 20
  save_best_only: true
